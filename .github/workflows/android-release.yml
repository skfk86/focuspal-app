name: Android Release Build

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ── Inject secrets into index.html ──────────────────────────────────────
      - name: Inject Groq API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          sed -i "s/const DEFAULT_GROQ_KEY = '';/const DEFAULT_GROQ_KEY = '${GROQ_API_KEY}';/" www/index.html

      - name: Inject AdMob IDs
        env:
          ADMOB_APP_ID:          ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID:     ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          # Replace the three placeholder strings written in index.html
          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY|${ADMOB_APP_ID}|g"          www/index.html
          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ|${ADMOB_INTERSTITIAL_ID}|g" www/index.html
          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX/WWWWWWWWWW|${ADMOB_REWARDED_ID}|g"     www/index.html

      # ── Generate native Android project ─────────────────────────────────────
      # No android/ folder is committed — we generate it fresh every run.
      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0b0f' --iconBackgroundColorDark '#0a0b0f'

      - name: Apply native customizations (manifest + AdMob + signing config)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 scripts/patch-android.py --signing

      - name: Sync Capacitor (web assets → native project)
        run: npx cap sync android

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release AAB + APK
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      # ── Publish ──────────────────────────────────────────────────────────────
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focuspal-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
