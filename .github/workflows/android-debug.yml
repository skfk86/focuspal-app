name: Android Debug Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # ── Inject secrets into index.html ──────────────────────────────────────
      - name: Inject Groq API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          sed -i "s/const DEFAULT_GROQ_KEY = '';/const DEFAULT_GROQ_KEY = '${GROQ_API_KEY}';/" www/index.html

      - name: Inject AdMob IDs (test IDs used if secrets are absent)
        env:
          ADMOB_APP_ID:          ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID:     ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          # Fall back to Google's official test IDs when secrets are not set
          # so debug builds always have a valid AdMob app ID.
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          INTER_ID="${ADMOB_INTERSTITIAL_ID:-ca-app-pub-3940256099942544/1033173712}"
          REWARDED_ID="${ADMOB_REWARDED_ID:-ca-app-pub-3940256099942544/5224354917}"

          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY|${APP_ID}|g"    www/index.html
          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ|${INTER_ID}|g"  www/index.html
          sed -i "s|ca-app-pub-XXXXXXXXXXXXXXXX/WWWWWWWWWW|${REWARDED_ID}|g" www/index.html

      # ── Generate native Android project ─────────────────────────────────────
      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0b0f' --iconBackgroundColorDark '#0a0b0f'

      - name: Apply native customizations (manifest + AdMob)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 scripts/patch-android.py

      - name: Sync Capacitor (web assets → native project)
        run: npx cap sync android

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focuspal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
